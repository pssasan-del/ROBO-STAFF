name: Validate Trend Breakout Retest V1

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python syntax compile
        run: |
          python -m py_compile trend_breakout_retest_v1.py trend_breakout_retest_stats.py trend_breakout_retest_telegram.py app.py bot.py delta_market_service.py

      - name: Validate TBR V1 rules and isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('trend_breakout_retest_v1.py').read_text()
          s=Path('trend_breakout_retest_stats.py').read_text()
          a=Path('app.py').read_text()
          for needle in [
              'MIN_CANDLES = 18','BREAKOUT_LOOKBACK = 12','RETEST_BARS = 3',
              'PAPER_RISK_PCT = 0.0025','MAX_TOTAL_RISK_PCT = 0.005','DAILY_LOSS_LIMIT_PCT = 0.01',
              'adx >= 22','1.20*avg','0.10*atr','0.15*atr','0.50*atr','1.80*atr',
              '1.85*net_risk','2.30*net_risk','c>0.20*d','_confirmed_pivots',
              'MAX_HOLD_5M_BARS = 6','DUPLICATE_SECONDS = 300',
              '/v2/l2orderbook/{symbol}','taker_commission_rate','WARMUP_18'
          ]:
              assert needle in t, needle
          assert 'CRYPTO_TREND_BREAKOUT_RETEST_SCALP_V1_18C_2026-10-02' in s
          assert 'success_rate' in s and 't1_hit_rate' in s
          assert 'asyncio.create_task(tbr_engine.loop()' in a
          assert 'tbr_v1_enabled' in a and 'tbr_paper_tracking' in a
          forbidden=['place_order(', 'modify_order(', 'cancel_order(', 'square_off(', '/v2/orders', 'DELTA_API_SECRET', 'DELTA_API_KEY']
          for path in ('trend_breakout_retest_v1.py','trend_breakout_retest_stats.py','trend_breakout_retest_telegram.py','app.py'):
              text=Path(path).read_text()
              for needle in forbidden:
                  assert needle not in text,(path,needle)
          print('TBR_V1_18C_OK')
          PY
