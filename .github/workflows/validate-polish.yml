name: Validate ROBO STAFF Fresh V4.1 Active Flow Scalp

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python syntax compile
        run: |
          python -m py_compile delta_signal_engine.py delta_options_service.py polish_policy.py precision_overlay.py market_research.py performance_store.py short_signal_formatter.py quick_option_shortcuts.py bot.py config.py strategy_engine.py master_mind_scalp.py app.py

      - name: Validate V4.1 active-flow policy
        run: |
          python - <<'PY'
          from copy import deepcopy
          from pathlib import Path
          from polish_policy import (
              POLISH_VERSION, MODE_REVISION, MIN_ALERT_SCORE, STRONG_SCORE, ELITE_SCORE,
              DAILY_RESEARCH_TARGET, BASE_COOLDOWN_MINUTES, evaluate_entry, contract_gate,
              quality_score, quality_label,
          )

          assert POLISH_VERSION == 'FRESH_V4.1_ACTIVE_FLOW_SCALP_2026-09-30'
          assert MODE_REVISION == 'ACTIVE_LOCAL_FLOW_2026-09-30'
          assert (MIN_ALERT_SCORE, STRONG_SCORE, ELITE_SCORE) == (50,66,82)
          assert DAILY_RESEARCH_TARGET == 6
          assert BASE_COOLDOWN_MINUTES == 4

          base={
              'symbol':'BTCUSD','direction':'MIXED','structure':'RANGE','pattern':'NONE',
              'setup_id':'BTCUSD:MIXED:NONE:123','daily_zone':'S1_TO_PIVOT','five_zone':'PIVOT_TO_R1',
              'vwap_distance_atr':1.0,'ema9_distance_atr':0.7,'breakout_extension_atr':0.5,
              'distance_to_next_pivot_atr':0.2,'one_min_breakout':False,
              'tf':{
                  '1m':{'price':101.0,'ema5':100.8,'ema9':100.5,'ema20':100.0,'vwap':100.6,'plus_di':24,'minus_di':21,'rsi':54,'williams_r':-48,'adx':12,'rel_volume':0.55,'atr':0.5},
                  '5m':{'price':101.0,'ema5':100.7,'ema9':100.4,'ema20':100.0,'vwap':100.5,'plus_di':25,'minus_di':22,'rsi':53,'williams_r':-49,'adx':13,'rel_volume':0.50,'atr':1.0},
                  '15m':{'price':100.2,'ema5':100.1,'ema9':100.2,'ema20':100.0,'vwap':100.2,'plus_di':20,'minus_di':20,'adx':15,'rel_volume':0.5},
                  '1h':{'price':100.0,'ema5':100.0,'ema9':100.0,'ema20':100.0,'vwap':100.0,'plus_di':20,'minus_di':20,'adx':14,'rel_volume':0.4},
              },
          }
          s=deepcopy(base)
          ok,reason=evaluate_entry('BTC','SETUP',s)
          assert ok, reason
          assert s['direction']=='BULLISH'
          assert s['pattern'] in {'PULLBACK_FLOW','STRUCTURE_FLOW','MOMENTUM_FLOW','MICRO_FLOW','BREAKOUT_FLOW'}
          score=quality_score('BTC',s,6.0)
          assert score >= MIN_ALERT_SCORE, score

          bad=deepcopy(base)
          for tf in ('15m','1h'):
              bad['tf'][tf].update({'price':98,'ema5':98.5,'ema9':99,'ema20':100,'vwap':99.5,'plus_di':10,'minus_di':32,'adx':30})
          ok,reason=evaluate_entry('BTC','SETUP',bad)
          assert not ok and 'both strongly opposite' in reason

          dead=deepcopy(base)
          dead['tf']['5m']['adx']=4;dead['tf']['5m']['rel_volume']=0.1;dead['tf']['1m']['rel_volume']=0.1
          ok,reason=evaluate_entry('BTC','SETUP',dead)
          assert not ok and 'dead tape' in reason

          assert contract_gate('BTC','OPTION BUY',entry=10.0,bid=9.8,ask=10.1,spot=80000,delta=.45,minutes_to_expiry=90,python_score=60)[0]
          assert not contract_gate('BTC','OPTION BUY',entry=.01,bid=.01,ask=.02,spot=80000,delta=.45,minutes_to_expiry=90,python_score=90)[0]
          assert quality_label(50)=='VALID' and quality_label(66)=='STRONG' and quality_label(82)=='ELITE'

          stats=Path('performance_store.py').read_text()
          overlay=Path('precision_overlay.py').read_text()
          formatter=Path('short_signal_formatter.py').read_text()
          app=Path('app.py').read_text()
          quick=Path('quick_option_shortcuts.py').read_text()
          assert "EPOCH='FRESH_V4.1_ACTIVE_FLOW_SCALP_2026-09-30'" in stats
          assert "STATS_TABLE='delta_signal_stats_v41'" in stats
          assert "return [('OPTION BUY', side, best)]" in overlay
          assert '(1.00, 1.50, 2.00)' in overlay
          assert 'ACTIVE FLOW SCALP' in formatter
          assert 'V4.1 active local-flow scalp' in app
          assert "master_mind_symbols':['BTCUSD','XAUTUSD']" in app
          assert "quick_option_keys':['B','E','X']" in app
          assert '"b": {"label": "BTC"' in quick
          assert '"e": {"label": "ETH"' in quick
          assert '"x": {"label": "GOLD"' in quick
          assert '("XAUT", "PAXG")' in quick
          assert 'Premium = *best ask* when available, otherwise mark price.' in quick
          assert 'Read-only display; no order is placed.' in quick

          forbidden=['place_order(', 'modify_order(', 'cancel_order(', 'square_off(', 'DELTA_API_SECRET', 'DELTA_API_KEY']
          for path in ('delta_signal_engine.py','polish_policy.py','precision_overlay.py','short_signal_formatter.py','quick_option_shortcuts.py'):
              text=Path(path).read_text()
              for needle in forbidden: assert needle not in text, (path,needle)
          print('FRESH_V41_ACTIVE_FLOW_SCALP_OK')
          print('QUICK_BEX_CHAIN_OK')
          PY
