name: Validate ROBO STAFF Fresh V4.1 Active Flow Scalp

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python syntax compile
        run: |
          python -m py_compile delta_signal_engine.py delta_options_service.py delta_account_read.py balance_shortcut.py polish_policy.py precision_overlay.py market_research.py performance_store.py short_signal_formatter.py quick_option_shortcuts.py bot.py config.py strategy_engine.py master_mind_scalp.py app.py

      - name: Validate V4.1 and read-only helpers
        run: |
          python - <<'PY'
          from copy import deepcopy
          from pathlib import Path
          from polish_policy import (
              POLISH_VERSION, MODE_REVISION, MIN_ALERT_SCORE, STRONG_SCORE, ELITE_SCORE,
              DAILY_RESEARCH_TARGET, BASE_COOLDOWN_MINUTES, evaluate_entry, contract_gate,
              quality_score, quality_label,
          )

          assert POLISH_VERSION == 'FRESH_V4.1_ACTIVE_FLOW_SCALP_2026-09-30'
          assert MODE_REVISION == 'ACTIVE_LOCAL_FLOW_2026-09-30'
          assert (MIN_ALERT_SCORE, STRONG_SCORE, ELITE_SCORE) == (50,66,82)
          assert DAILY_RESEARCH_TARGET == 6
          assert BASE_COOLDOWN_MINUTES == 4

          base={
              'symbol':'BTCUSD','direction':'MIXED','structure':'RANGE','pattern':'NONE',
              'setup_id':'BTCUSD:MIXED:NONE:123','daily_zone':'S1_TO_PIVOT','five_zone':'PIVOT_TO_R1',
              'vwap_distance_atr':1.0,'ema9_distance_atr':0.7,'breakout_extension_atr':0.5,
              'distance_to_next_pivot_atr':0.2,'one_min_breakout':False,
              'tf':{
                  '1m':{'price':101.0,'ema5':100.8,'ema9':100.5,'ema20':100.0,'vwap':100.6,'plus_di':24,'minus_di':21,'rsi':54,'williams_r':-48,'adx':12,'rel_volume':0.55,'atr':0.5},
                  '5m':{'price':101.0,'ema5':100.7,'ema9':100.4,'ema20':100.0,'vwap':100.5,'plus_di':25,'minus_di':22,'rsi':53,'williams_r':-49,'adx':13,'rel_volume':0.50,'atr':1.0},
                  '15m':{'price':100.2,'ema5':100.1,'ema9':100.2,'ema20':100.0,'vwap':100.2,'plus_di':20,'minus_di':20,'adx':15,'rel_volume':0.5},
                  '1h':{'price':100.0,'ema5':100.0,'ema9':100.0,'ema20':100.0,'vwap':100.0,'plus_di':20,'minus_di':20,'adx':14,'rel_volume':0.4},
              },
          }
          s=deepcopy(base)
          ok,reason=evaluate_entry('BTC','SETUP',s)
          assert ok, reason
          assert s['direction']=='BULLISH'
          assert s['pattern'] in {'PULLBACK_FLOW','STRUCTURE_FLOW','MOMENTUM_FLOW','MICRO_FLOW','BREAKOUT_FLOW'}
          assert quality_score('BTC',s,6.0) >= MIN_ALERT_SCORE
          assert contract_gate('BTC','OPTION BUY',entry=10.0,bid=9.8,ask=10.1,spot=80000,delta=.45,minutes_to_expiry=90,python_score=60)[0]
          assert quality_label(50)=='VALID' and quality_label(66)=='STRONG' and quality_label(82)=='ELITE'

          app=Path('app.py').read_text()
          quick=Path('quick_option_shortcuts.py').read_text()
          account=Path('delta_account_read.py').read_text()
          balance=Path('balance_shortcut.py').read_text()
          config=Path('config.py').read_text()
          assert '/v2/wallet/balances' in account
          assert '💰 Balance' in balance
          assert 'DELTA_API_KEY' in config and 'DELTA_API_SECRET' in config
          assert 'install_balance_shortcut' in app
          assert 'auto_trading' in app and 'False' in app
          assert 'B=BTC' in app and 'E=ETH' in app and 'X=GOLD' in app
          assert 'best ask' in quick and 'no order is placed' in quick

          forbidden_trade=['/v2/orders','place_order(', 'modify_order(', 'cancel_order(', 'square_off(', '/orders/leverage']
          for path in ('delta_account_read.py','balance_shortcut.py'):
              text=Path(path).read_text()
              for needle in forbidden_trade:
                  assert needle not in text, (path,needle)
          print('FRESH_V41_ACTIVE_FLOW_SCALP_OK')
          print('QUICK_BEX_CHAIN_OK')
          print('READ_ONLY_BALANCE_OK')
          PY
