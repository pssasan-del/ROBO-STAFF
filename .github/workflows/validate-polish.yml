name: Validate ROBO STAFF Fresh V3.2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python syntax compile
        run: |
          python -m py_compile delta_signal_engine.py delta_options_service.py polish_policy.py market_research.py performance_store.py bot.py config.py strategy_engine.py

      - name: Validate V3.2 scalp research policy
        run: |
          python - <<'PY'
          from copy import deepcopy
          from polish_policy import (
              POLISH_VERSION, MODE_REVISION, MIN_ALERT_SCORE, STRONG_SCORE, ELITE_SCORE,
              evaluate_entry, evaluate_contract, contract_gate, quality_score,
              quality_label, ai_adjustment, ACCEPTANCE_CRITERIA,
          )

          assert POLISH_VERSION == 'FRESH_V3.2_2026-09-27'
          assert MODE_REVISION == 'SCALP_RESEARCH_LOOSE_2026-09-28'
          assert (MIN_ALERT_SCORE, STRONG_SCORE, ELITE_SCORE) == (78, 90, 95)
          assert ACCEPTANCE_CRITERIA['min_resolved'] == 50
          assert ACCEPTANCE_CRITERIA['min_profit_factor'] == 1.35

          base = {
              'direction':'BULLISH', 'structure':'HH/HL', 'pattern':'BREAKOUT',
              'price_ema_aligned':True, 'one_min_trigger':True,
              'one_min_breakout':True, 'one_min_ema_hold':True,
              'daily_zone':'PIVOT_TO_R1', 'five_zone':'PIVOT_TO_R1',
              'choppy':False, 'overextended':False, 'pivot_extension_valid':False,
              'distance_to_next_pivot_atr':1.4, 'breakout_extension_atr':0.35,
              'vwap_distance_atr':0.6, 'ema9_distance_atr':0.4,
              'last_closed_5m':101.0, 'breakout_level':100.4,
              'setup_id':'BTCUSD:BULLISH:BREAKOUT:123',
              'ema_cross_5m':{'side':'BULLISH','bars_ago':0},
              'tf':{
                  '1m':{'price':101,'ema5':100.5,'ema9':100,'ema20':99.5,'vwap':100,'adx':25,'plus_di':31,'minus_di':18,'rsi':60,'williams_r':-35,'rel_volume':1.3},
                  '5m':{'price':101,'ema5':100.5,'ema9':100,'ema20':99,'vwap':100,'adx':29,'plus_di':32,'minus_di':18,'rsi':61,'williams_r':-32,'rel_volume':1.55},
                  '15m':{'price':101,'ema5':100.5,'ema9':100,'ema20':99.5,'vwap':100,'adx':24,'plus_di':29,'minus_di':18,'trend':'BULLISH'},
                  '1h':{'price':101,'ema5':100.7,'ema9':100.2,'ema20':99.5,'vwap':100,'adx':23,'plus_di':28,'minus_di':17,'trend':'BULLISH'},
              },
          }
          ok, reason = evaluate_entry('BTC','OPTION BUY',deepcopy(base))
          assert ok, reason

          # Mature breakout continuation with an old EMA cross.
          momentum = deepcopy(base)
          momentum['pattern'] = 'NONE'
          momentum['setup_id'] = 'BTCUSD:BULLISH:NONE:456'
          momentum['ema_cross_5m'] = {'side':'NONE','bars_ago':None}
          momentum['tf']['5m']['rel_volume'] = 0.95
          momentum['tf']['5m']['adx'] = 26
          momentum['tf']['5m']['plus_di'] = 31
          momentum['tf']['5m']['minus_di'] = 20
          momentum['breakout_extension_atr'] = 0.55
          momentum['distance_to_next_pivot_atr'] = 0.8
          momentum['vwap_distance_atr'] = 1.2
          momentum['ema9_distance_atr'] = 0.65
          ok, reason = evaluate_entry('BTC','OPTION BUY',momentum)
          assert ok, reason
          assert momentum['pattern'] == 'MOMENTUM_CONTINUATION'
          assert momentum['momentum_mode'] is True

          # Scalp continuation: 5m has not yet cleared the old six-bar high,
          # but full EMA stack + 1m trigger + acceptable ADX/DI/RVOL is enough
          # for research mode.
          scalp = deepcopy(base)
          scalp['pattern'] = 'NONE'
          scalp['setup_id'] = 'BTCUSD:BULLISH:NONE:789'
          scalp['ema_cross_5m'] = {'side':'NONE','bars_ago':None}
          scalp['last_closed_5m'] = 100.2
          scalp['breakout_level'] = 100.4
          scalp['distance_to_next_pivot_atr'] = 0.55
          scalp['breakout_extension_atr'] = 0.35
          scalp['vwap_distance_atr'] = 1.10
          scalp['ema9_distance_atr'] = 0.55
          scalp['tf']['5m']['adx'] = 23
          scalp['tf']['5m']['plus_di'] = 28
          scalp['tf']['5m']['minus_di'] = 20
          scalp['tf']['5m']['rel_volume'] = 0.78
          ok, reason = evaluate_entry('BTC','OPTION BUY',scalp)
          assert ok, reason
          assert scalp['pattern'] == 'SCALP_CONTINUATION'
          assert scalp['scalp_mode'] is True
          assert quality_score('BTC',scalp,10.0) >= 78

          # Weak/chasing scalp still rejected.
          weak = deepcopy(scalp)
          weak['pattern']='NONE'; weak['momentum_mode']=False; weak['scalp_mode']=False
          weak['tf']['5m']['adx']=18
          assert evaluate_entry('BTC','OPTION BUY',weak)[0] is False
          chase = deepcopy(scalp)
          chase['pattern']='NONE'; chase['momentum_mode']=False; chase['scalp_mode']=False
          chase['breakout_extension_atr']=1.30
          assert evaluate_entry('BTC','OPTION BUY',chase)[0] is False

          assert evaluate_contract(0.01,bid=0.01,ask=0.02,underlying='BTC',action='OPTION BUY',spot=80000,delta=.35)[0] is False
          assert evaluate_contract(1.00,bid=.98,ask=1.02,underlying='BTC',action='OPTION BUY',spot=80000,delta=.35)[0] is False
          assert evaluate_contract(1.00,bid=.99,ask=1.01,underlying='BTC',action='OPTION BUY',spot=80000,delta=.35)[0] is True
          assert evaluate_contract(1.00,bid=.99,ask=1.01,underlying='ETH',action='OPTION BUY',spot=3000,delta=.05)[0] is False
          assert evaluate_contract(1.00,bid=.99,ask=1.01,underlying='BTC',action='OPTION BUY',spot=80000,delta=.35,minutes_to_expiry=60,python_score=95)[0] is False
          assert contract_gate('GOLD','OPTION SELL',entry=1.00,bid=.98,ask=1.02,spot=4300,delta=-.25,minutes_to_expiry=400,python_score=90)[0] is True

          assert quality_label(78) == 'VALID'
          assert quality_label(90) == 'STRONG'
          assert quality_label(95) == 'ELITE'
          assert ai_adjustment('CONFIRM',85) == 3
          assert ai_adjustment('REJECT',95) == -7
          assert ai_adjustment('WAIT',75) == -3
          print('FRESH_V32_SCALP_RESEARCH_TESTS_OK')
          PY

      - name: Validate implementation invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('delta_signal_engine.py').read_text()
          policy = Path('polish_policy.py').read_text()
          research = Path('market_research.py').read_text()
          stats = Path('performance_store.py').read_text()
          bot = Path('bot.py').read_text()

          required_engine = [
              "entry=float(ask if action == 'OPTION BUY' else bid)",
              "option_snapshot.get('best_bid') if c.action == 'OPTION BUY' else option_snapshot.get('best_ask')",
              "sl_breaches", "loss_r>=1.35", "WEAK/STALLED", "INVALIDATED", "STALE",
              "CORRELATION_THRESHOLD", "contract_rank_score", "fib_r1", "fib_s1",
          ]
          for needle in required_engine:
              assert needle in engine, needle

          assert "FRESH_V3.2_2026-09-27" in policy
          assert "SCALP_RESEARCH_LOOSE_2026-09-28" in policy
          assert "SCALP_CONTINUATION" in policy
          assert "delta_research_signals_v32" in research
          assert "delta_signal_stats_v32" in stats
          assert "promotion_ready" in research
          assert "candidate_rules" in research
          assert "Research never auto-modifies live rules" in bot
          assert "SIGNAL ONLY — NO ORDER EXECUTED" in engine

          forbidden = ['place_order(', 'modify_order(', 'cancel_order(', 'square_off(', 'DELTA_API_SECRET', 'DELTA_API_KEY']
          for needle in forbidden:
              assert needle not in engine, f'forbidden execution/private credential token: {needle}'

          print('FRESH_V32_SCALP_RESEARCH_INVARIANTS_OK')
          PY
