name: Validate ROBO STAFF V5 Clean Confluence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python syntax compile
        run: |
          python -m py_compile delta_signal_engine.py delta_options_service.py polish_policy.py precision_overlay.py option_premium_analysis.py option_premium_history_service.py market_research.py performance_store.py short_signal_formatter.py bot.py config.py strategy_engine.py master_mind_scalp.py app.py

      - name: Validate V5 clean confluence policy
        run: |
          python - <<'PY'
          from copy import deepcopy
          from pathlib import Path
          from polish_policy import (
              POLISH_VERSION, MODE_REVISION, MIN_ALERT_SCORE, STRONG_SCORE, ELITE_SCORE,
              DAILY_RESEARCH_TARGET, BASE_COOLDOWN_MINUTES, DAILY_SIGNAL_CAP,
              evaluate_entry, contract_gate, quality_score, quality_label,
          )

          assert POLISH_VERSION == 'FRESH_V5_CLEAN_CONFLUENCE_2026-10-02'
          assert MODE_REVISION == 'CLEAN_1M_5M_15M_CONFLUENCE_2026-10-02'
          assert (MIN_ALERT_SCORE, STRONG_SCORE, ELITE_SCORE) == (64,76,88)
          assert DAILY_RESEARCH_TARGET == 8
          assert BASE_COOLDOWN_MINUTES == 5
          assert DAILY_SIGNAL_CAP == {'BTC':50,'ETH':50,'GOLD':30}

          base={
              'symbol':'BTCUSD','direction':'MIXED','structure':'HH/HL','pattern':'NONE',
              'setup_id':'BTCUSD:MIXED:NONE:123','daily_zone':'PIVOT_TO_R1','five_zone':'PIVOT_TO_R1',
              'vwap_distance_atr':0.8,'ema9_distance_atr':0.5,'breakout_extension_atr':0.3,
              'distance_to_next_pivot_atr':1.0,'one_min_breakout':False,
              'tf':{
                  '1m':{'price':101.0,'ema5':100.8,'ema9':100.5,'ema20':100.0,'vwap':100.6,'plus_di':26,'minus_di':19,'rsi':56,'williams_r':-45,'adx':15,'rel_volume':0.70,'atr':0.5},
                  '5m':{'price':101.0,'ema5':100.7,'ema9':100.4,'ema20':100.0,'vwap':100.5,'plus_di':28,'minus_di':19,'rsi':55,'williams_r':-46,'adx':18,'rel_volume':0.80,'atr':1.0},
                  '15m':{'price':100.5,'ema5':100.3,'ema9':100.2,'ema20':100.0,'vwap':100.2,'plus_di':22,'minus_di':19,'rsi':54,'williams_r':-48,'adx':17,'rel_volume':0.55},
                  '1h':{'price':100.2,'ema5':100.1,'ema9':100.0,'ema20':99.9,'vwap':100.0,'plus_di':21,'minus_di':20,'rsi':52,'williams_r':-50,'adx':14,'rel_volume':0.45},
              },
          }

          s=deepcopy(base);ok,reason=evaluate_entry('BTC','SETUP',s)
          assert ok,reason
          assert s['direction']=='BULLISH'
          assert s['pattern']=='PULLBACK_RESUME'
          score=quality_score('BTC',s,60)
          assert score>=MIN_ALERT_SCORE,score

          bad=deepcopy(base)
          bad['tf']['15m'].update({'price':98,'ema5':98.5,'ema9':99,'ema20':100,'vwap':99.5,'plus_di':10,'minus_di':32,'adx':28})
          ok,reason=evaluate_entry('BTC','SETUP',bad)
          assert not ok and '15m strong opposite' in reason

          chase=deepcopy(base);chase['vwap_distance_atr']=2.8
          ok,reason=evaluate_entry('BTC','SETUP',chase)
          assert not ok and 'chased entry' in reason

          assert contract_gate('BTC','OPTION BUY',entry=10.0,bid=9.85,ask=10.1,spot=80000,delta=.45,minutes_to_expiry=120,python_score=72)[0]
          assert not contract_gate('BTC','OPTION BUY',entry=10.0,bid=9.0,ask=10.5,spot=80000,delta=.45,minutes_to_expiry=120,python_score=90)[0]
          assert quality_label(64)=='VALID' and quality_label(76)=='STRONG' and quality_label(88)=='ELITE'

          stats=Path('performance_store.py').read_text()
          overlay=Path('precision_overlay.py').read_text()
          formatter=Path('short_signal_formatter.py').read_text()
          app=Path('app.py').read_text()
          assert "EPOCH='FRESH_V5_CLEAN_CONFLUENCE_2026-10-02'" in stats
          assert "STATS_TABLE='delta_signal_stats_v5_clean_confluence'" in stats
          assert 'v5_clean_confluence_installed' in overlay
          assert "return [('OPTION BUY', side, best)]" in overlay
          assert 'V5 CLEAN CONFLUENCE' in formatter
          assert 'install_precision_overlay(delta_auto_engine)' in app
          assert 'install_scalp_opportunity_overlay' not in app
          assert 'install_active_flow_indicator_overlay' not in app
          assert "'master_mind_symbols':['BTCUSD','XAUTUSD']" in app
          assert "'telegram_alerts':True" in app

          forbidden=['place_order(', 'modify_order(', 'cancel_order(', 'square_off(', '/v2/orders', 'DELTA_API_SECRET', 'DELTA_API_KEY']
          for path in ('polish_policy.py','precision_overlay.py','short_signal_formatter.py','app.py'):
              text=Path(path).read_text()
              for needle in forbidden: assert needle not in text,(path,needle)
          print('ROBO_STAFF_V5_CLEAN_CONFLUENCE_OK')
          PY
