name: Validate ROBO STAFF Fresh V3.7 Balanced Scalp

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python syntax compile
        run: |
          python -m py_compile delta_signal_engine.py delta_options_service.py polish_policy.py market_research.py performance_store.py short_signal_formatter.py bot.py config.py strategy_engine.py master_mind_scalp.py app.py

      - name: Validate V3.7 balanced confirmation policy
        run: |
          python - <<'PY'
          from copy import deepcopy
          from pathlib import Path
          from polish_policy import (
              POLISH_VERSION, MODE_REVISION, MIN_ALERT_SCORE, STRONG_SCORE, ELITE_SCORE,
              DAILY_RESEARCH_TARGET, BASE_COOLDOWN_MINUTES, evaluate_entry, contract_gate,
              quality_score, quality_label,
          )

          assert POLISH_VERSION == 'FRESH_V3.7_BALANCED_SCALP_2026-09-29'
          assert MODE_REVISION == 'BALANCED_CONFIRMATION_SCALP_2026-09-29'
          assert (MIN_ALERT_SCORE, STRONG_SCORE, ELITE_SCORE) == (58,72,86)
          assert DAILY_RESEARCH_TARGET == 5
          assert BASE_COOLDOWN_MINUTES == 5

          base={
              'symbol':'BTCUSD','direction':'MIXED','structure':'HH/HL','pattern':'NONE',
              'setup_id':'BTCUSD:MIXED:NONE:123','daily_zone':'PIVOT_TO_R1','five_zone':'PIVOT_TO_R1',
              'vwap_distance_atr':1.0,'ema9_distance_atr':0.45,'breakout_extension_atr':0.4,
              'tf':{
                  '1m':{'price':101,'ema9':100.5,'ema20':100,'vwap':100.4,'plus_di':28,'minus_di':18,'rsi':58,'williams_r':-35,'adx':18,'rel_volume':0.9},
                  '5m':{'price':101,'ema9':100.4,'ema20':99.8,'vwap':100.2,'plus_di':29,'minus_di':18,'rsi':57,'williams_r':-38,'adx':18,'rel_volume':0.8},
                  '15m':{'price':101,'ema9':100.2,'ema20':99.7,'vwap':100.0,'plus_di':27,'minus_di':19,'rsi':56,'williams_r':-40},
                  '1h':{'price':100.8,'ema9':100.0,'ema20':99.5,'vwap':99.9,'plus_di':25,'minus_di':20},
              },
          }
          s=deepcopy(base)
          ok,reason=evaluate_entry('BTC','SETUP',s)
          assert ok, reason
          assert s['direction']=='BULLISH'
          assert s['confirmation_count'] >= 5
          assert s['pattern'] in {'PULLBACK_CONFIRM','BREAKOUT_CONFIRM','TREND_SCALP','MICRO_CONFIRM'}
          score=quality_score('BTC',s,7.0)
          assert score >= MIN_ALERT_SCORE, score

          weak=deepcopy(base)
          weak['tf']['1m'].update({'price':99,'ema9':100,'ema20':100.5,'plus_di':15,'minus_di':30,'rsi':40,'williams_r':-80})
          assert evaluate_entry('BTC','SETUP',weak)[0] is False

          assert contract_gate('BTC','OPTION BUY',entry=1.0,bid=.99,ask=1.01,spot=80000,delta=.30,minutes_to_expiry=180,python_score=70)[0]
          assert contract_gate('BTC','OPTION SELL',entry=1.0,bid=.99,ask=1.01,spot=80000,delta=.20,minutes_to_expiry=180,python_score=65)[0]
          assert not contract_gate('BTC','OPTION BUY',entry=.01,bid=.01,ask=.02,spot=80000,delta=.30,minutes_to_expiry=180,python_score=90)[0]
          assert quality_label(58)=='VALID' and quality_label(72)=='STRONG' and quality_label(86)=='ELITE'

          stats=Path('performance_store.py').read_text()
          assert "EPOCH='FRESH_V3.7_BALANCED_SCALP_2026-09-29'" in stats
          assert "STATS_TABLE='delta_signal_stats_v37'" in stats
          formatter=Path('short_signal_formatter.py').read_text()
          assert 'ROBO STAFF — SCALP SIGNAL' in formatter and 'Confirmations:' in formatter
          app=Path('app.py').read_text()
          assert 'format_short_signal' in app

          forbidden=['place_order(', 'modify_order(', 'cancel_order(', 'square_off(', 'DELTA_API_SECRET', 'DELTA_API_KEY']
          for path in ('delta_signal_engine.py','polish_policy.py','short_signal_formatter.py'):
              text=Path(path).read_text()
              for needle in forbidden: assert needle not in text, (path,needle)
          print('FRESH_V37_BALANCED_SCALP_OK')
          PY
