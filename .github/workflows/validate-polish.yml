name: Validate ROBO STAFF Fresh V2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax compile
        run: |
          python -m py_compile delta_signal_engine.py polish_policy.py market_research.py performance_store.py bot.py config.py
      - name: Validate Fresh V2 policy
        run: |
          python - <<'PY'
          from polish_policy import POLISH_VERSION, evaluate_entry, evaluate_contract

          assert POLISH_VERSION == 'FRESH_V2_2026-09-26'
          # V2 does not tune entries from the old V1 W/L buckets.
          assert evaluate_entry('BTC', 'OPTION BUY', {})[0] is True
          assert evaluate_entry('ETH', 'OPTION SELL', {})[0] is True
          assert evaluate_entry('GOLD', 'OPTION BUY', {})[0] is True

          # Root fix: 0.01-style contracts cannot become trade signals.
          assert evaluate_contract(0.01)[0] is False
          assert evaluate_contract(0.04)[0] is False
          assert evaluate_contract(0.10)[0] is True
          assert evaluate_contract(1.00, bid=0.50, ask=0.80)[0] is False
          assert evaluate_contract(1.00, bid=0.98, ask=1.02)[0] is True
          print('FRESH_V2_POLICY_TESTS_OK')
          PY
