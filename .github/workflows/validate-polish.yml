name: Validate ROBO STAFF V4.3 Professional Scalp

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python syntax compile
        run: |
          python -m py_compile delta_signal_engine.py delta_options_service.py polish_policy.py precision_overlay.py active_flow_indicator_overlay.py option_premium_analysis.py option_premium_history_service.py scalp_cost_model.py futures_context_service.py scalp_opportunity_overlay.py performance_display_overlay.py market_research.py performance_store.py short_signal_formatter.py bot.py config.py strategy_engine.py master_mind_scalp.py app.py

      - name: Validate V4.3 professional scalp policy
        run: |
          python - <<'PY'
          from copy import deepcopy
          from pathlib import Path
          from polish_policy import (
              POLISH_VERSION, MODE_REVISION, MIN_ALERT_SCORE, STRONG_SCORE, ELITE_SCORE,
              DAILY_RESEARCH_TARGET, BASE_COOLDOWN_MINUTES, evaluate_entry, contract_gate,
              quality_score, quality_label,
          )
          from active_flow_indicator_overlay import _side_of, _cross_9_18
          from option_premium_analysis import analyze_premium_rows, analyze_oi_rows, classify_premium_oi
          from scalp_cost_model import futures_round_trip_cost_points, option_round_trip_cost, edge_after_cost

          assert POLISH_VERSION == 'FRESH_V4.1_ACTIVE_FLOW_SCALP_2026-09-30'
          assert MODE_REVISION == 'ACTIVE_LOCAL_FLOW_2026-09-30'
          assert (MIN_ALERT_SCORE, STRONG_SCORE, ELITE_SCORE) == (50,66,82)
          assert DAILY_RESEARCH_TARGET == 6
          assert BASE_COOLDOWN_MINUTES == 4

          base={
              'symbol':'BTCUSD','direction':'MIXED','structure':'RANGE','pattern':'NONE',
              'setup_id':'BTCUSD:MIXED:NONE:123','daily_zone':'S1_TO_PIVOT','five_zone':'PIVOT_TO_R1',
              'vwap_distance_atr':1.0,'ema9_distance_atr':0.7,'breakout_extension_atr':0.5,
              'distance_to_next_pivot_atr':0.2,'one_min_breakout':False,
              'tf':{
                  '1m':{'price':101.0,'ema5':100.8,'ema9':100.5,'ema20':100.0,'vwap':100.6,'plus_di':24,'minus_di':21,'rsi':54,'williams_r':-48,'adx':12,'rel_volume':0.55,'atr':0.5},
                  '5m':{'price':101.0,'ema5':100.7,'ema9':100.4,'ema20':100.0,'vwap':100.5,'plus_di':25,'minus_di':22,'rsi':53,'williams_r':-49,'adx':13,'rel_volume':0.50,'atr':1.0},
                  '15m':{'price':100.2,'ema5':100.1,'ema9':100.2,'ema20':100.0,'vwap':100.2,'plus_di':20,'minus_di':20,'adx':15,'rel_volume':0.5},
                  '1h':{'price':100.0,'ema5':100.0,'ema9':100.0,'ema20':100.0,'vwap':100.0,'plus_di':20,'minus_di':20,'adx':14,'rel_volume':0.4},
              },
          }
          s=deepcopy(base);ok,reason=evaluate_entry('BTC','SETUP',s)
          assert ok,reason
          assert s['direction']=='BULLISH'
          assert quality_score('BTC',s,6.0)>=MIN_ALERT_SCORE
          assert quality_label(50)=='VALID' and quality_label(66)=='STRONG' and quality_label(82)=='ELITE'
          assert contract_gate('BTC','OPTION BUY',entry=10.0,bid=9.8,ask=10.1,spot=80000,delta=.45,minutes_to_expiry=90,python_score=60)[0]
          assert _side_of(101,100)=='ABOVE' and _side_of(99,100)=='BELOW'

          rows=[];p=10.0
          for i in range(40):
              p+=0.03 if i<20 else 0.10
              rows.append({'time':i*300,'open':p-0.05,'high':p+0.10,'low':p-0.10,'close':p,'volume':100+i*4})
          pa=analyze_premium_rows(rows)
          assert pa['sufficient'] and pa['gate_pass'] and pa['momentum_score']>=60
          oi=[];o=1000.0
          for i in range(12):
              o+=20;oi.append({'time':i*300,'open':o-5,'high':o+5,'low':o-5,'close':o,'volume':0})
          oa=analyze_oi_rows(oi);assert oa['sufficient'] and oa['change_pct']>0
          assert classify_premium_oi(pa['change_3bar_pct'],oa['change_pct'])['label']=='PREMIUM_UP_OI_UP'

          fc=futures_round_trip_cost_points(84000)
          assert fc['break_even_points']>0 and fc['break_even_pct']>0
          oc=option_round_trip_cost(400,84000,8)
          assert oc['total_cost']>8 and oc['break_even_pct']>0
          assert edge_after_cost(gross_profit=120,risk=60,total_cost=20)['cost_gate_pass']
          assert not edge_after_cost(gross_profit=30,risk=60,total_cost=20)['cost_gate_pass']

          stats=Path('performance_store.py').read_text()
          v42=Path('precision_overlay.py').read_text()
          v43=Path('scalp_opportunity_overlay.py').read_text()
          fctx=Path('futures_context_service.py').read_text()
          costs=Path('scalp_cost_model.py').read_text()
          formatter=Path('short_signal_formatter.py').read_text()
          app=Path('app.py').read_text()
          assert "EPOCH='FRESH_V4.3_COST_TIMING_OI_RR185_2026-10-01'" in stats
          assert "STATS_TABLE='delta_signal_stats_v43_professional_scalp'" in stats
          assert 'record_edge_estimate' in stats
          assert "return [('OPTION BUY',side,best)]" in v42
          assert '(1.85,2.30,3.00)' in v42
          assert 'WAIT_1M_RETEST' in fctx and "FUNDING:{symbol}" in fctx and "OI:{symbol}" in fctx
          assert 'MIN_GROSS_TO_COST_MULTIPLE' in costs and 'option_round_trip_cost' in costs
          assert 'OPTION BUY' in v43 and 'OPTION SELL' in v43 and 'FUTURE LONG' in v43 and 'FUTURE SHORT' in v43
          assert 'preferred_vehicle' in v43 and 'cost_gate_pass' in v43
          assert 'BROKERAGE / BREAK-EVEN ESTIMATE' in formatter and 'SCALP OPPORTUNITY MATRIX' in formatter
          assert 'install_scalp_opportunity_overlay(delta_auto_engine)' in app
          assert "master_mind_symbols':['BTCUSD','XAUTUSD']" in app

          forbidden=['place_order(', 'modify_order(', 'cancel_order(', 'square_off(', '/v2/orders', 'DELTA_API_SECRET', 'DELTA_API_KEY']
          for path in ('precision_overlay.py','active_flow_indicator_overlay.py','option_premium_analysis.py','option_premium_history_service.py','scalp_cost_model.py','futures_context_service.py','scalp_opportunity_overlay.py','short_signal_formatter.py'):
              text=Path(path).read_text()
              for needle in forbidden:assert needle not in text,(path,needle)
          print('ACTIVE_FLOW_V43_PROFESSIONAL_SCALP_OK')
          PY
